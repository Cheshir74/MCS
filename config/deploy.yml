# Name of your application. Used to uniquely configure containers.
service: mcs

# Image name in GitHub Container Registry. GitHub Actions publishes:
#   ghcr.io/cheshir74/mcs:<git-sha>
#   ghcr.io/cheshir74/mcs:latest
image: cheshir74/mcs

# Keep the base config environment-agnostic. Deploy with:
#   kamal setup -d staging
#   kamal deploy -d staging
require_destination: true

registry:
  server: ghcr.io
  username: public
  password: public

builder:
  arch: amd64

proxy:
  ssl: false
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

env:
  clear:
    DATABASE_HOST: mcs-postgres
    DATABASE_PORT: 5432
    DATABASE_NAME: MSC_production
    DATABASE_USER: mcs
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
  secret:
    - DATABASE_PASSWORD
    - ENCRYPTION_KEY
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE

volumes:
  - mcs_storage:/app/storage

asset_path: /app/public/assets

accessories:
  postgres:
    service: mcs-postgres
    image: postgres:16
    host: 89.22.234.238
    env:
      clear:
        POSTGRES_DB: MSC_production
        POSTGRES_USER: mcs
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /home/depus/mcs/postgres/data:/var/lib/postgresql/data
