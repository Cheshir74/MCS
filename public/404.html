<!DOCTYPE html>
<html>
<head>
  <title>Страница не найдена (404)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
  .error-page {
    background-color: #f6f7fb;
    color: #1f2937;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
  }

  .error-page .dialog {
    width: 95%;
    max-width: 33em;
    margin: 4em auto 0;
  }

  .error-page .panel {
    border: 1px solid #d8dde8;
    border-top: #2f66d0 solid 4px;
    border-radius: 8px;
    background-color: white;
    padding: 28px 12%;
    box-shadow: 0 10px 24px rgba(31, 41, 55, 0.08);
  }

  .error-page h1 {
    font-size: 140%;
    color: #111827;
    line-height: 1.35;
    margin: 0 0 12px;
  }

  .error-page p {
    color: #4b5563;
    line-height: 1.5;
    margin: 0 0 20px;
  }

  .error-page a {
    color: #ffffff;
    background: #2f66d0;
    border-radius: 6px;
    display: inline-block;
    font-weight: 700;
    padding: 10px 18px;
    text-decoration: none;
  }
  </style>
</head>

<body class="error-page">
  <div class="dialog">
    <div class="panel">
      <h1>Страница не найдена</h1>
      <p>Адрес мог измениться или страница была удалена.</p>
      <a href="/">Вернуться на главную</a>
    </div>
  </div>
</body>
</html>
