<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Ошибка сервера | 500</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --panel: #f7f3ec;
      --ink: #171717;
      --muted: #68615a;
      --line: rgba(247, 243, 236, 0.22);
      --accent: #c84f3d;
      --accent-dark: #883225;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--panel);
      background:
        linear-gradient(135deg, rgba(16, 17, 20, 0.92), rgba(16, 17, 20, 0.74)),
        radial-gradient(circle at 18% 16%, rgba(200, 79, 61, 0.24), transparent 32%),
        linear-gradient(120deg, #101114, #2b2b2d 52%, #171717);
      font-family: Arial, Helvetica, sans-serif;
    }

    .error-page {
      display: grid;
      min-height: 100vh;
      padding: 32px;
      place-items: center;
    }

    .error-card {
      width: min(100%, 920px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(16, 17, 20, 0.58);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
      overflow: hidden;
    }

    .error-card__inner {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      min-height: 420px;
    }

    .error-code {
      display: grid;
      align-content: end;
      padding: 34px;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(rgba(16, 17, 20, 0.1), rgba(16, 17, 20, 0.72)),
        repeating-linear-gradient(90deg, rgba(247, 243, 236, 0.08) 0 1px, transparent 1px 80px);
    }

    .error-code span {
      display: block;
      color: rgba(247, 243, 236, 0.68);
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .error-code strong {
      display: block;
      margin-top: 18px;
      color: var(--panel);
      font-size: clamp(84px, 16vw, 156px);
      line-height: 0.9;
      font-weight: 800;
    }

    .error-copy {
      display: grid;
      align-content: center;
      padding: 54px;
      background: var(--panel);
      color: var(--ink);
    }

    h1 {
      max-width: 560px;
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1;
      font-weight: 800;
    }

    p {
      max-width: 520px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      border-radius: 6px;
      padding: 12px 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .button-primary {
      color: #fff;
      background: var(--accent);
    }

    .button-secondary {
      color: var(--accent-dark);
      border: 1px solid rgba(136, 50, 37, 0.28);
      background: rgba(255, 255, 255, 0.42);
    }

    @media (max-width: 760px) {
      .error-page { padding: 16px; }
      .error-card__inner { grid-template-columns: 1fr; }
      .error-code {
        min-height: 190px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .error-copy { padding: 34px 24px; }
    }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
      <div class="error-card__inner">
        <div class="error-code">
          <span>Server error</span>
          <strong>500</strong>
        </div>
        <div class="error-copy">
          <h1 id="error-title">Что-то пошло не так</h1>
          <p>Сервер не смог обработать запрос. Мы можем посмотреть логи, а пока попробуйте обновить страницу или вернуться позже.</p>
          <div class="error-actions">
            <a class="button-primary" href="/">Вернуться на главную</a>
            <a class="button-secondary" href="mailto:hello@tolstosheev.photo">Написать</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
