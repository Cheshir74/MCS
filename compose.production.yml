services:
  web:
    build:
      context: .
    image: ${WEB_IMAGE:-mcs-web:latest}
    env_file:
      - ./.env.production
    environment:
      DOCKER_CONTAINER: "true"
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
    volumes:
      - ./data/storage:/app/storage
      - ./secrets/credentials.yml.enc:/app/config/credentials.yml.enc:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    env_file:
      - ./.env.production
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
